<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stickman Runner</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* スクロールを禁止 */
      background: #fff;
      touch-action: none; /* スマホの操作によるバウンスやズームを防止 */
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 画面サイズ設定
    let groundY = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      groundY = canvas.height * 0.8; // 地面の位置を画面下部（80%の位置）に設定
      if (player.isGrounded) {
        player.y = groundY;
      }
    }

    // プレイヤー状態
    let player = {
      x: 60,
      y: 0,
      dy: 0,
      gravity: 0.6,
      firstJumpPower: -12,
      secondJumpPower: -13,
      isGrounded: false,
      jumpCount: 0,
      maxJumps: 2,
      runFrame: 0
    };

    let obstacles = [];
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('stickman_cactus_highscore') || 0;
    let gameOver = false;

    // 初期リサイズ実行
    resizeCanvas();
    player.y = groundY;
    window.addEventListener('resize', resizeCanvas);

    // 棒人間描画
    function drawPlayer() {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let headX = player.x;
      let headY = player.y - 35;

      // 頭
      ctx.beginPath();
      ctx.arc(headX, headY, 9, 0, Math.PI * 2);
      ctx.stroke();

      // 体
      ctx.beginPath();
      ctx.moveTo(headX, headY + 9);
      ctx.lineTo(headX, player.y - 10);
      ctx.stroke();

      if (player.isGrounded) {
        player.runFrame += 0.25;
        let legAngle = Math.sin(player.runFrame) * 14;
        let armAngle = Math.sin(player.runFrame) * 12;

        // 脚
        ctx.beginPath();
        ctx.moveTo(headX, player.y - 10);
        ctx.lineTo(headX - legAngle, player.y);
        ctx.moveTo(headX, player.y - 10);
        ctx.lineTo(headX + legAngle, player.y);
        ctx.stroke();

        // 腕
        ctx.beginPath();
        ctx.moveTo(headX, headY + 15);
        ctx.lineTo(headX + armAngle, headY + 25);
        ctx.moveTo(headX, headY + 15);
        ctx.lineTo(headX - armAngle, headY + 25);
        ctx.stroke();
      } else {
        // ジャンプポーズ
        ctx.beginPath();
        ctx.moveTo(headX, player.y - 10);
        ctx.lineTo(headX - 8, player.y - 2);
        ctx.lineTo(headX - 12, player.y + 5);

        ctx.moveTo(headX, player.y - 10);
        ctx.lineTo(headX + 8, player.y - 4);
        ctx.lineTo(headX + 10, player.y + 3);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(headX, headY + 15);
        ctx.lineTo(headX - 12, headY + 8);
        ctx.moveTo(headX, headY + 15);
        ctx.lineTo(headX + 12, headY + 8);
        ctx.stroke();
      }
    }

    // サボテン描画
    function drawCactus(obs) {
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;

      ctx.fillRect(obs.x + obs.w * 0.35, obs.y, obs.w * 0.3, obs.h);

      if (obs.h >= 30) {
        ctx.fillRect(obs.x, obs.y + obs.h * 0.3, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x, obs.y + obs.h * 0.15, obs.w * 0.12, obs.h * 0.25);

        ctx.fillRect(obs.x + obs.w * 0.6, obs.y + obs.h * 0.45, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x + obs.w * 0.88, obs.y + obs.h * 0.25, obs.w * 0.12, obs.h * 0.25);
      }
    }

    // 飛んでくるナイフ描画
    function drawKnife(obs) {
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;

      let x = obs.x;
      let y = obs.y;

      ctx.beginPath();
      ctx.moveTo(x, y + 8);
      ctx.lineTo(x + 22, y + 1);
      ctx.lineTo(x + 22, y + 15);
      ctx.closePath();
      ctx.fill();

      ctx.fillRect(x + 22, y + 5, 10, 5);
      ctx.fillRect(x + 32, y + 3, 3, 9);
    }

    function update() {
      if (gameOver) return;
      frame++;

      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y >= groundY) {
        player.y = groundY;
        player.dy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
      }

      let gameSpeed = 6 + Math.floor(score / 5) * 0.7;
      let spawnInterval = Math.max(45, 90 - Math.floor(score / 4) * 4);

      if (frame % spawnInterval === 0) {
        let isKnife = score >= 5 && Math.random() < 0.35;

        if (isKnife) {
          // ナイフ（高さは画面サイズ基準）
          let knifeY = groundY - (Math.random() < 0.5 ? 80 : 50);
          obstacles.push({ x: canvas.width, y: knifeY, w: 35, h: 16, type: 'knife' });
        } else {
          // サボテン
          let cactusType = Math.random();
          let h, w;
          if (cactusType < 0.3) {
            h = 55; w = 28;
          } else if (cactusType < 0.7) {
            h = 40; w = 24;
          } else {
            h = 28; w = 18;
          }
          obstacles.push({ x: canvas.width, y: groundY - h, w: w, h: h, type: 'cactus' });
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;

        let pLeft = player.x - 8;
        let pRight = player.x + 8;
        let pTop = player.y - 42;
        let pBottom = player.y;

        let oLeft = obstacles[i].x;
        let oRight = obstacles[i].x + obstacles[i].w;
        let oTop = obstacles[i].y;
        let oBottom = obstacles[i].y + obstacles[i].h;

        if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
          gameOver = true;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('stickman_cactus_highscore', highScore);
          }
        }

        if (obstacles[i].x < -40) {
          obstacles.splice(i, 1);
          score++;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 地面
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      drawPlayer();

      obstacles.forEach(obs => {
        if (obs.type === 'knife') {
          drawKnife(obs);
        } else {
          drawCactus(obs);
        }
      });

      // UI
      ctx.fillStyle = '#000';
      ctx.font = "bold 16px sans-serif";
      ctx.fillText("SCORE: " + score, 15, 35);
      ctx.fillText("HI-SCORE: " + highScore, 140, 35);

      let remainingJumps = player.maxJumps - player.jumpCount;
      ctx.font = "14px sans-serif";
      ctx.fillText("JUMP: " + "★".repeat(remainingJumps), canvas.width - 110, 35);

      // ゲームオーバー画面
      if (gameOver) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';

        ctx.font = "bold 28px sans-serif";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

        ctx.font = "18px sans-serif";
        ctx.fillText("Score: " + score + "  (Best: " + highScore + ")", canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Tap to Restart", canvas.width / 2, canvas.height / 2 + 50);

        ctx.textAlign = 'left'; // 描画設定をデフォルトに戻す
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handleAction(e) {
      if (e) e.preventDefault();

      if (gameOver) {
        obstacles = [];
        score = 0;
        frame = 0;
        player.y = groundY;
        player.dy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
        gameOver = false;
      } else {
        if (player.jumpCount < player.maxJumps) {
          player.dy = (player.jumpCount === 0) ? player.firstJumpPower : player.secondJumpPower;
          player.isGrounded = false;
          player.jumpCount++;
        }
      }
    }

    canvas.addEventListener('pointerdown', handleAction, { passive: false });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleAction(e); });

    loop();
  </script>
</body>
</html>
