<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stickman Runner</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 仮想画面サイズ
    const V_WIDTH = 480;
    const V_HEIGHT = 200;
    const GROUND_Y = 160;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.resetTransform();
      ctx.scale(canvas.width / V_WIDTH, canvas.height / V_HEIGHT);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);

    // プレイヤー状態
    let player = {
      x: 60,
      y: GROUND_Y,
      dy: 0,
      gravity: 0.5,
      firstJumpPower: -9,
      secondJumpPower: -10,
      isGrounded: false,
      jumpCount: 0,
      maxJumps: 2,
      runFrame: 0
    };

    let obstacles = [];
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('stickman_runner_highscore') || 0;
    let gameOver = false;

    // 棒人間描画
    function drawPlayer() {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let headX = player.x;
      let headY = player.y - 30;

      // 頭
      ctx.beginPath();
      ctx.arc(headX, headY, 7, 0, Math.PI * 2);
      ctx.stroke();

      // 体
      ctx.beginPath();
      ctx.moveTo(headX, headY + 7);
      ctx.lineTo(headX, player.y - 8);
      ctx.stroke();

      if (player.isGrounded) {
        player.runFrame += 0.25;
        let legAngle = Math.sin(player.runFrame) * 12;
        let armAngle = Math.sin(player.runFrame) * 10;

        // 脚
        ctx.beginPath();
        ctx.moveTo(headX, player.y - 8);
        ctx.lineTo(headX - legAngle, player.y);
        ctx.moveTo(headX, player.y - 8);
        ctx.lineTo(headX + legAngle, player.y);
        ctx.stroke();

        // 腕
        ctx.beginPath();
        ctx.moveTo(headX, headY + 12);
        ctx.lineTo(headX + armAngle, headY + 20);
        ctx.moveTo(headX, headY + 12);
        ctx.lineTo(headX - armAngle, headY + 20);
        ctx.stroke();
      } else {
        // ジャンプポーズ
        ctx.beginPath();
        ctx.moveTo(headX, player.y - 8);
        ctx.lineTo(headX - 6, player.y - 2);
        ctx.lineTo(headX - 10, player.y + 4);

        ctx.moveTo(headX, player.y - 8);
        ctx.lineTo(headX + 6, player.y - 4);
        ctx.lineTo(headX + 8, player.y + 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(headX, headY + 12);
        ctx.lineTo(headX - 10, headY + 5);
        ctx.moveTo(headX, headY + 12);
        ctx.lineTo(headX + 10, headY + 5);
        ctx.stroke();
      }
    }

    // サボテン描画
    function drawCactus(obs) {
      ctx.fillStyle = '#000';
      ctx.fillRect(obs.x + obs.w * 0.35, obs.y, obs.w * 0.3, obs.h);

      if (obs.h >= 25) {
        ctx.fillRect(obs.x, obs.y + obs.h * 0.3, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x, obs.y + obs.h * 0.15, obs.w * 0.12, obs.h * 0.25);

        ctx.fillRect(obs.x + obs.w * 0.6, obs.y + obs.h * 0.45, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x + obs.w * 0.88, obs.y + obs.h * 0.25, obs.w * 0.12, obs.h * 0.25);
      }
    }

    // 回転するナイフの描画（中心軸回転）
    function drawRotatingKnife(obs) {
      ctx.save();
      let centerX = obs.x + obs.w / 2;
      let centerY = obs.y + obs.h / 2;
      
      ctx.translate(centerX, centerY);
      ctx.rotate(obs.angle);

      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;

      let w = obs.w;
      let h = obs.h;

      // 刃の描画
      ctx.beginPath();
      ctx.moveTo(-w / 2, 0);
      ctx.lineTo(0, -h / 2);
      ctx.lineTo(0, h / 2);
      ctx.closePath();
      ctx.fill();

      // 柄（持ち手）の描画
      ctx.fillRect(0, -h / 4, w / 2, h / 2);
      ctx.restore();
    }

    function update() {
      if (gameOver) return;
      frame++;

      // 足元に凹状態の穴（hole）があるか判定
      let inHole = obstacles.some(obs => 
        obs.type === 'hole' && (player.x >= obs.x && player.x <= obs.x + obs.w)
      );

      player.dy += player.gravity;
      player.y += player.dy;

      if (!inHole && player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.dy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
      } else if (inHole && player.y >= GROUND_Y) {
        player.isGrounded = false; // 穴の上では着地できない
      }

      // 穴に落下して画面外に消えた場合
      if (player.y > V_HEIGHT + 40) {
        triggerGameOver();
      }

      let gameSpeed = 5 + Math.floor(score / 5) * 0.6;
      let spawnInterval = Math.max(50, 95 - Math.floor(score / 4) * 4);

      // 障害物の生成（穴、回転ナイフ、サボテンのみ）
      if (frame % spawnInterval === 0) {
        let rand = Math.random();

        if (rand < 0.3) {
          // 凹型の穴（幅50〜70px、深さ35px）
          let holeWidth = 50 + Math.floor(Math.random() * 20);
          obstacles.push({ x: V_WIDTH, y: GROUND_Y, w: holeWidth, h: 35, type: 'hole' });
        } else if (rand < 0.65) {
          // 回転しながら横移動するナイフ
          let knifeY = Math.random() < 0.5 ? 90 : 120;
          obstacles.push({ 
            x: V_WIDTH, 
            y: knifeY, 
            w: 28, 
            h: 12, 
            angle: 0, 
            rotSpeed: 0.25, // 回転スピード
            type: 'knife' 
          });
        } else {
          // サボテン
          let h = 32, w = 20;
          obstacles.push({ x: V_WIDTH, y: GROUND_Y - h, w: w, h: h, type: 'cactus' });
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // ナイフの回転処理
        if (obs.type === 'knife') {
          obs.angle += obs.rotSpeed;
        }

        // 当たり判定（穴以外）
        if (obs.type !== 'hole') {
          let pLeft = player.x - 6;
          let pRight = player.x + 6;
          let pTop = player.y - 35;
          let pBottom = player.y;

          let oLeft = obs.x;
          let oRight = obs.x + obs.w;
          let oTop = obs.y;
          let oBottom = obs.y + obs.h;

          if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
            triggerGameOver();
          }
        }

        // 画面外削除
        if (obs.x < -80) {
          obstacles.splice(i, 1);
          score++;
        }
      }
    }

    function triggerGameOver() {
      gameOver = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('stickman_runner_highscore', highScore);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // 地面と凹型の穴の描画
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();

      let currentX = 0;
      let holes = obstacles.filter(o => o.type === 'hole').sort((a, b) => a.x - b.x);

      holes.forEach(hole => {
        // 穴の手前までの地面
        if (hole.x > currentX) {
          ctx.moveTo(currentX, GROUND_Y);
          ctx.lineTo(Math.min(hole.x, V_WIDTH), GROUND_Y);
        }

        // 凹形状（左壁 -> 穴の底 -> 右壁）を描画
        let leftX = hole.x;
        let rightX = hole.x + hole.w;
        let bottomY = GROUND_Y + hole.h;

        ctx.moveTo(leftX, GROUND_Y);
        ctx.lineTo(leftX, bottomY);
        ctx.lineTo(rightX, bottomY);
        ctx.lineTo(rightX, GROUND_Y);

        currentX = Math.max(currentX, rightX);
      });

      // 最後の穴から右端までの地面
      if (currentX < V_WIDTH) {
        ctx.moveTo(currentX, GROUND_Y);
        ctx.lineTo(V_WIDTH, GROUND_Y);
      }
      ctx.stroke();

      drawPlayer();

      // 障害物の描画
      obstacles.forEach(obs => {
        if (obs.type === 'knife') {
          drawRotatingKnife(obs);
        } else if (obs.type === 'cactus') {
          drawCactus(obs);
        }
      });

      // UI
      ctx.fillStyle = '#000';
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("SCORE: " + score, 10, 25);
      ctx.fillText("HI-SCORE: " + highScore, 130, 25);

      let remainingJumps = player.maxJumps - player.jumpCount;
      ctx.font = "12px sans-serif";
      ctx.fillText("JUMP: " + "★".repeat(Math.max(0, remainingJumps)), 380, 25);

      if (gameOver) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.fillStyle = '#000';
        ctx.font = "bold 22px sans-serif";
        ctx.fillText("GAME OVER", 170, 80);

        ctx.font = "15px sans-serif";
        ctx.fillText("Score: " + score + "  (Best: " + highScore + ")", 160, 110);
        ctx.fillText("Tap to Restart", 185, 145);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handleAction(e) {
      if (e) e.preventDefault();

      if (gameOver) {
        obstacles = [];
        score = 0;
        frame = 0;
        player.y = GROUND_Y;
        player.dy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
        gameOver = false;
      } else {
        if (player.jumpCount < player.maxJumps) {
          player.dy = (player.jumpCount === 0) ? player.firstJumpPower : player.secondJumpPower;
          player.isGrounded = false;
          player.jumpCount++;
        }
      }
    }

    canvas.addEventListener('pointerdown', handleAction, { passive: false });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleAction(e); });

    resizeCanvas();
    loop();
  </script>
</body>
</html>
