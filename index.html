<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GoStickman</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 内部仮想解像度
    const V_WIDTH = 480;
    const V_HEIGHT = 200;
    const GROUND_Y = 160;

    // ゲーム状態 (title, playing, gameover)
    let gameState = 'title';

    // Web Audio API & BGM管理
    let audioCtx = null;
    let bgmTimeout = null;
    let bgmStep = 0;
    let currentBgmMode = null; // 'title' または 'game'
    let currentBgmInterval = 120; // ミリ秒

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ジャンプ効果音
    function playJumpSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      } catch (e) {}
    }

    // BGMの1音を鳴らすループ（可変テンポ対応）
    function tickBGM() {
      if (!audioCtx) return;

      if (gameState === 'title' && currentBgmMode === 'title') {
        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 587.33, 440.00, 349.23]; 
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          const freq = notes[bgmStep % notes.length];
          const now = audioCtx.currentTime;

          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}

        bgmStep++;
        bgmTimeout = setTimeout(tickBGM, 140);

      } else if (gameState === 'playing' && currentBgmMode === 'game') {
        const notes = [329.63, 392.00, 493.88, 587.33, 523.25, 440.00, 392.00, 329.63, 293.66, 349.23, 440.00, 523.25, 493.88, 392.00, 329.63, 293.66];
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          const freq = notes[bgmStep % notes.length];
          const now = audioCtx.currentTime;

          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch (e) {}

        bgmStep++;
        bgmTimeout = setTimeout(tickBGM, currentBgmInterval);
      }
    }

    function startTitleBGM() {
      if (currentBgmMode === 'title' && bgmTimeout) return;
      stopBGM();
      currentBgmMode = 'title';
      bgmStep = 0;
      tickBGM();
    }

    function startGameBGM() {
      if (currentBgmMode === 'game' && bgmTimeout) return;
      stopBGM();
      currentBgmMode = 'game';
      bgmStep = 0;
      tickBGM();
    }

    function stopBGM() {
      if (bgmTimeout) {
        clearTimeout(bgmTimeout);
        bgmTimeout = null;
      }
      currentBgmMode = null;
    }

    function resizeCanvas() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      const targetRatio = V_WIDTH / V_HEIGHT;
      const currentRatio = windowW / windowH;

      let renderW, renderH;

      if (currentRatio > targetRatio) {
        renderH = windowH;
        renderW = windowH * targetRatio;
      } else {
        renderW = windowW;
        renderH = windowW / targetRatio;
      }

      const dpr = window.devicePixelRatio || 1;
      canvas.width = renderW * dpr;
      canvas.height = renderH * dpr;
      canvas.style.width = renderW + 'px';
      canvas.style.height = renderH + 'px';

      ctx.resetTransform();
      ctx.scale(canvas.width / V_WIDTH, canvas.height / V_HEIGHT);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);

    // プレイヤー状態
    let player = {
      x: 60,
      y: GROUND_Y,
      dy: 0,
      gravity: 0.5,
      firstJumpPower: -9,
      secondJumpPower: -10,
      isGrounded: false,
      jumpCount: 0,
      maxJumps: 2,
      runFrame: 0,
      isFallingInHole: false
    };

    // オープニング用棒人間
    let titleStickman = {
      x: 60,
      y: GROUND_Y,
      dy: 0,
      dir: 1,
      speed: 2.2,
      minX: 40,
      maxX: 440,
      runFrame: 0,
      jumpTimer: 0
    };

    let obstacles = [];
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('stickman_runner_highscore') || 0;

    // 関節つき肢（腕・脚）を描画する補助関数
    // x, y: 付け根座標
    // rot1: 大腿/上腕の角度（正が前方）
    // len1: 腿/上腕の長さ
    // rot2: 膝/肘の曲がり角度（正が後ろへ曲げる）
    // len2: 脛/前腕の長さ
    function drawLimb(x, y, rot1, len1, rot2, len2) {
      // 進行方向（右）を基準とした座標計算
      let kneeX = x + Math.sin(rot1) * len1;
      let kneeY = y + Math.cos(rot1) * len1;

      let footX = kneeX + Math.sin(rot1 - rot2) * len2;
      let footY = kneeY + Math.cos(rot1 - rot2) * len2;

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(kneeX, kneeY, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 関節つき棒人間描画関数（前走り動作修正版）
    function drawStickman(x, y, runFrame, isGrounded, dir = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);

      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 前傾姿勢をつけて躍動感を出す
      let lean = isGrounded ? 0.15 : 0.05;
      ctx.rotate(lean);

      let headX = 0;
      let headY = -32;
      let hipX = -2;
      let hipY = -12;
      let shoulderX = 1;
      let shoulderY = -24;

      // 頭
      ctx.beginPath();
      ctx.arc(headX, headY, 6.5, 0, Math.PI * 2);
      ctx.stroke();

      // 胴体
      ctx.beginPath();
      ctx.moveTo(headX, headY + 6.5);
      ctx.lineTo(hipX, hipY);
      ctx.stroke();

      if (isGrounded) {
        // 正しい前走りアニメーションの位相制御
        let sinVal = Math.sin(runFrame);
        let cosVal = Math.cos(runFrame);

        // 脚（正の角度＝前方に振り出し）
        let legRotR = sinVal * 0.7; 
        let kneeBendR = (sinVal < 0) ? -sinVal * 1.1 : 0.1; // 後ろへ蹴り上げて前に戻す時に膝を曲げる

        let legRotL = -sinVal * 0.7;
        let kneeBendL = (sinVal > 0) ? sinVal * 1.1 : 0.1;

        // 腕（足と逆位相で振る）
        let armRotR = -sinVal * 0.65;
        let elbowBendR = 0.5 + Math.abs(sinVal) * 0.3; // 肘は常に軽く前に曲げる

        let armRotL = sinVal * 0.65;
        let elbowBendL = 0.5 + Math.abs(sinVal) * 0.3;

        // 奥側の手足を先に描画
        drawLimb(shoulderX, shoulderY, armRotL, 7, elbowBendL, 7);
        drawLimb(hipX, hipY, legRotL, 8, kneeBendL, 8);

        // 手前側の手足
        drawLimb(hipX, hipY, legRotR, 8, kneeBendR, 8);
        drawLimb(shoulderX, shoulderY, armRotR, 7, elbowBendR, 7);

      } else {
        // 前進ジャンプのポーズ
        drawLimb(hipX, hipY, 0.6, 8, 0.8, 8);   // 前脚（前に出して曲げる）
        drawLimb(hipX, hipY, -0.7, 8, 0.3, 8);  // 後ろ脚（後ろへ伸ばす）

        drawLimb(shoulderX, shoulderY, -0.8, 7, 0.6, 7); // 前腕
        drawLimb(shoulderX, shoulderY, 0.7, 7, 0.6, 7);  // 後ろ腕
      }

      ctx.restore();
    }

    // サボテン描画
    function drawCactus(obs) {
      ctx.fillStyle = '#000';
      ctx.fillRect(obs.x + obs.w * 0.35, obs.y, obs.w * 0.3, obs.h);

      if (obs.h <= 20) {
        ctx.fillRect(obs.x, obs.y + obs.h * 0.4, obs.w * 0.4, obs.h * 0.2);
        ctx.fillRect(obs.x, obs.y + obs.h * 0.2, obs.w * 0.18, obs.h * 0.3);

        ctx.fillRect(obs.x + obs.w * 0.6, obs.y + obs.h * 0.55, obs.w * 0.4, obs.h * 0.2);
        ctx.fillRect(obs.x + obs.w * 0.82, obs.y + obs.h * 0.35, obs.w * 0.18, obs.h * 0.3);
      } else {
        ctx.fillRect(obs.x, obs.y + obs.h * 0.3, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x, obs.y + obs.h * 0.15, obs.w * 0.12, obs.h * 0.25);

        ctx.fillRect(obs.x + obs.w * 0.6, obs.y + obs.h * 0.45, obs.w * 0.4, obs.h * 0.12);
        ctx.fillRect(obs.x + obs.w * 0.88, obs.y + obs.h * 0.25, obs.w * 0.12, obs.h * 0.25);
      }
    }

    // 回転ナイフ描画
    function drawRotatingKnife(obs) {
      ctx.save();
      let centerX = obs.x + obs.w / 2;
      let centerY = obs.y + obs.h / 2;

      ctx.translate(centerX, centerY);
      ctx.rotate(obs.angle);

      let grad = ctx.createLinearGradient(-7, -3, -7, 3);
      grad.addColorStop(0, '#e0e0e0');
      grad.addColorStop(0.5, '#ffffff');
      grad.addColorStop(1, '#888888');

      ctx.fillStyle = grad;
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 0.8;

      ctx.beginPath();
      ctx.moveTo(7, 3);
      ctx.lineTo(-2, -3);
      ctx.lineTo(-7, -3);
      ctx.lineTo(-7, 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#111';
      ctx.fillRect(-13, -2, 6, 4);

      ctx.restore();
    }

    // 黒色の王冠（Crown）アイコン描画
    function drawCrownIcon(x, y) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1;
      ctx.lineJoin = 'miter';

      ctx.beginPath();
      ctx.moveTo(-9, 5);
      ctx.lineTo(-10, -5);
      ctx.lineTo(-4, -1);
      ctx.lineTo(0, -8);
      ctx.lineTo(4, -1);
      ctx.lineTo(10, -5);
      ctx.lineTo(9, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-8, 3);
      ctx.lineTo(8, 3);
      ctx.stroke();

      ctx.restore();
    }

    function resetGame() {
      obstacles = [];
      score = 0;
      frame = 0;
      player.y = GROUND_Y;
      player.dy = 0;
      player.isGrounded = true;
      player.jumpCount = 0;
      player.runFrame = 0;
      player.isFallingInHole = false;
      gameState = 'playing';
      startGameBGM();
    }

    function update() {
      if (gameState === 'title') {
        startTitleBGM();

        titleStickman.x += titleStickman.speed * titleStickman.dir;
        titleStickman.runFrame += 0.22;

        if (titleStickman.x > titleStickman.maxX) {
          titleStickman.x = titleStickman.maxX;
          titleStickman.dir = -1;
        } else if (titleStickman.x < titleStickman.minX) {
          titleStickman.x = titleStickman.minX;
          titleStickman.dir = 1;
        }

        titleStickman.jumpTimer++;
        if (titleStickman.jumpTimer % 65 === 0 && titleStickman.y >= GROUND_Y) {
          titleStickman.dy = -5.2; 
          playJumpSound();
        }

        titleStickman.dy += 0.4;
        titleStickman.y += titleStickman.dy;

        if (titleStickman.y >= GROUND_Y) {
          titleStickman.y = GROUND_Y;
          titleStickman.dy = 0;
        }
        return;
      }

      if (gameState !== 'playing') return;
      startGameBGM();
      frame++;

      // スコア10毎のスクロール速度の計算 (初期値: 3.0, 10毎に+0.8)
      let speedLevel = Math.floor(score / 10);
      let gameSpeed = 3.0 + speedLevel * 0.8;

      // スクロールスピードに連動してBGMのテンポを加速
      currentBgmInterval = Math.max(55, 125 - speedLevel * 10);

      // 走りアニメーションの速度同期
      if (player.isGrounded) {
        player.runFrame += gameSpeed * 0.055;
      }

      let inHole = obstacles.some(obs =>
        obs.type === 'hole' && (player.x >= obs.x + 4 && player.x <= obs.x + obs.w - 4)
      );

      player.dy += player.gravity;
      player.y += player.dy;

      if (!inHole && !player.isFallingInHole && player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.dy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
      } else if (inHole && player.y >= GROUND_Y) {
        player.isGrounded = false;
        player.isFallingInHole = true;
      }

      if (player.y > V_HEIGHT + 40) {
        triggerGameOver();
      }

      let spawnInterval = Math.max(40, Math.floor(115 - speedLevel * 9));

      if (frame % spawnInterval === 0) {
        let rand = Math.random();

        if (rand < 0.28) {
          let holeWidth = 45 + Math.floor(Math.random() * 20);
          obstacles.push({ x: V_WIDTH, y: GROUND_Y, w: holeWidth, h: 35, type: 'hole' });
        } else if (rand < 0.6) {
          let knifeY = Math.random() < 0.5 ? 100 : 130;
          obstacles.push({
            x: V_WIDTH,
            y: knifeY,
            w: 15,
            h: 6,
            angle: 0,
            rotSpeed: 0.3,
            type: 'knife'
          });
        } else {
          let typeRand = Math.random();
          let h, w;

          if (typeRand < 0.35) {
            h = 20; w = 16;
          } else if (typeRand < 0.7) {
            h = 32; w = 20;
          } else {
            h = 44; w = 24;
          }

          obstacles.push({ x: V_WIDTH, y: GROUND_Y - h, w: w, h: h, type: 'cactus' });
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        if (obs.type === 'knife') {
          obs.angle += obs.rotSpeed;
        }

        if (obs.type !== 'hole') {
          let pLeft = player.x - 6;
          let pRight = player.x + 6;
          let pTop = player.y - 35;
          let pBottom = player.y;

          let oLeft = obs.x;
          let oRight = obs.x + obs.w;
          let oTop = obs.y;
          let oBottom = obs.y + obs.h;

          if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
            triggerGameOver();
          }
        }

        if (obs.x < -80) {
          obstacles.splice(i, 1);
          score++;
        }
      }
    }

    function triggerGameOver() {
      gameState = 'gameover';
      stopBGM();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('stickman_runner_highscore', highScore);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // オープニング画面描画
      if (gameState === 'title') {
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // 地面
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(V_WIDTH, GROUND_Y);
        ctx.stroke();

        // 棒人間描画
        let isGrounded = titleStickman.y >= GROUND_Y;
        drawStickman(titleStickman.x, titleStickman.y, titleStickman.runFrame, isGrounded, titleStickman.dir);

        ctx.textAlign = 'center';

        // タイトル文字
        ctx.fillStyle = '#111';
        ctx.font = "900 32px 'Arial Black', Gadget, sans-serif";
        ctx.fillText("GoStickman", V_WIDTH / 2, 35);

        // スタートボタン
        let btnX = V_WIDTH / 2 - 50;
        let btnY = 52;
        let btnW = 100;
        let btnH = 26;

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 13);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("START", V_WIDTH / 2, 69);

        ctx.textAlign = 'left';
        return;
      }

      // 本編描画
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();

      let currentX = 0;
      let holes = obstacles.filter(o => o.type === 'hole').sort((a, b) => a.x - b.x);

      holes.forEach(hole => {
        if (hole.x > currentX) {
          ctx.moveTo(currentX, GROUND_Y);
          ctx.lineTo(Math.min(hole.x, V_WIDTH), GROUND_Y);
        }

        let leftX = hole.x;
        let rightX = hole.x + hole.w;
        let bottomY = GROUND_Y + hole.h;

        ctx.moveTo(leftX, GROUND_Y);
        ctx.lineTo(leftX, bottomY);
        ctx.lineTo(rightX, bottomY);
        ctx.lineTo(rightX, GROUND_Y);

        currentX = Math.max(currentX, rightX);
      });

      if (currentX < V_WIDTH) {
        ctx.moveTo(currentX, GROUND_Y);
        ctx.lineTo(V_WIDTH, GROUND_Y);
      }
      ctx.stroke();

      // プレイヤー描画
      drawStickman(player.x, player.y, player.runFrame, player.isGrounded, 1);

      obstacles.forEach(obs => {
        if (obs.type === 'knife') {
          drawRotatingKnife(obs);
        } else if (obs.type === 'cactus') {
          drawCactus(obs);
        }
      });

      // UI描画
      ctx.fillStyle = '#000';
      ctx.font = "bold 14px sans-serif";

      let scoreText = "SCORE: " + score;
      ctx.fillText(scoreText, 10, 25);

      if (score > 0 && score % 10 === 0) {
        let textWidth = ctx.measureText(scoreText).width;
        drawCrownIcon(10 + textWidth + 16, 20);
      }

      ctx.fillText("HI-SCORE: " + highScore, 210, 25);

      let remainingJumps = player.maxJumps - player.jumpCount;
      ctx.font = "12px sans-serif";
      ctx.fillText("JUMP: " + "★".repeat(Math.max(0, remainingJumps)), 390, 25);

      // ゲームオーバー描画
      if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.textAlign = "center";

        ctx.fillStyle = '#e60000';
        ctx.font = "900 36px 'Arial Black', Gadget, sans-serif";
        ctx.fillText("Game Over", V_WIDTH / 2, 85);

        ctx.fillStyle = '#333333';
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("Score: " + score + "   (Best: " + highScore + ")", V_WIDTH / 2, 118);

        ctx.fillStyle = '#666666';
        ctx.font = "13px sans-serif";
        ctx.fillText("Tap to Title", V_WIDTH / 2, 148);

        ctx.textAlign = "left";
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handleAction(e) {
      if (e) e.preventDefault();
      initAudio();

      if (gameState === 'title') {
        resetGame();
      } else if (gameState === 'gameover') {
        gameState = 'title';
      } else if (gameState === 'playing') {
        if (player.jumpCount < player.maxJumps) {
          player.dy = (player.jumpCount === 0) ? player.firstJumpPower : player.secondJumpPower;
          player.isGrounded = false;
          player.jumpCount++;
          playJumpSound();
        }
      }
    }

    canvas.addEventListener('pointerdown', handleAction, { passive: false });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleAction(e); });

    resizeCanvas();
    loop();
  </script>
</body>
</html>
